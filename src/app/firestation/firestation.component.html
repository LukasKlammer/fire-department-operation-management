<div class="bordered-box">
  <h2>Übersicht Feuerwache</h2>

  <mat-chip-list>
    <table aria-label="Fahrzeugübersicht der Feuerwache">
      <tr *ngFor="let row of rosterRows">
        <td *ngFor="let vehicle of row" [class.empty-space]="!vehicle">
          <mat-chip *ngIf="vehicle" [ngClass]="{'opacity': !isVehicleAvailable(vehicle)}">
            {{ vehicle }}
          </mat-chip>
        </td>
      </tr>
    </table>
  </mat-chip-list>
</div>
